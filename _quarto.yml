project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - Chinese.qmd
    - Russian.qmd
    - wiki/*.qmd
  pre-render: node scripts/build-wiki.mjs
  resources:
    - llms.txt
    - llms-full.txt
    - robots.txt
    - wiki/index.json
    - wiki/raw/*.md
  
website:
  page-navigation: true
  title: "Yulong He"
  site-url: https://hreyulog.github.io
  favicon: images/yulong.jpg
  repo-url: https://github.com/hreyulog/hreyulog.github.io
  search: false
  
  page-footer:
    left: |
      [Yulong He](https://hreyulog.github.io)<br>
    center: |
      PV <span id="busuanzi_site_pv">-</span> · UV <span id="busuanzi_site_uv">-</span><br>
    right: |
      [贺育隆](https://hreyulog.github.io) · [研究笔记](/wiki/index.qmd)<br>
    
  navbar: 
    background: "#90a9d1"
    right: 
      - text: "English"
        href: index.qmd
      - text: "中文"
        href: Chinese.qmd
      - text: "Русский"
        href: Russian.qmd

format:
  html:
    canonical-url: true
    theme: styles.scss
    include-after-body: _includes/busuanzi.html
    toc: true            # 启用目录
    toc-position: left  # 将目录放置在页面的右侧
    toc-depth: 3         # 设置目录的深度，数字越大，目录越详细
